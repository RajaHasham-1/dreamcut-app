<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamCut — Professional Multitrack Video Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f3f;
        }
    </style>
</head>
<body class="bg-black text-neutral-200 overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Sample Stock Assets
        const STOCK_VIDEOS = [
            { id: 'v1', name: 'Cyberpunk Neon City', duration: 12, src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', thumb: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=300&auto=format&fit=crop' },
            { id: 'v2', name: 'Cinematic Mountain Fog', duration: 15, src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', thumb: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300&auto=format&fit=crop' },
            { id: 'v3', name: 'Urban Sunset Waves', duration: 10, src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4', thumb: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=300&auto=format&fit=crop' }
        ];

        const STOCK_AUDIO = [
            { id: 'a1', name: 'Synthwave Beat 120BPM', duration: 30, genre: 'Electronic' },
            { id: 'a2', name: 'Lo-Fi Chill Hop Beat', duration: 45, genre: 'Chill' },
            { id: 'a3', name: 'Cinematic Ambient Score', duration: 60, genre: 'Cinematic' }
        ];

        const TEXT_PRESETS = [
            { id: 't1', name: 'Default Title', text: 'DREAMCUT', font: 'sans-serif', size: 36, color: '#ffffff' },
            { id: 't2', name: 'Cyber Neon', text: 'NEON NIGHTS', font: 'monospace', size: 42, color: '#00f0ff' },
            { id: 't3', name: 'Cinematic Subtitle', text: 'Chapter 01: The Beginning', font: 'serif', size: 24, color: '#f5f5f5' }
        ];

        function DreamCutApp() {
            const [activeTab, setActiveTab] = useState('media');
            const [aspectRatio, setAspectRatio] = useState('16:9');
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [totalDuration, setTotalDuration] = useState(30);
            const [activeClipId, setActiveClipId] = useState('c1');
            const [exportModal, setExportModal] = useState(false);
            const [exportProgress, setExportProgress] = useState(0);

            // Timeline Clips State
            const [clips, setClips] = useState([
                { id: 'c1', track: 'video', name: 'Cyberpunk Neon City', startTime: 0, duration: 12, type: 'video', scale: 100, opacity: 100, brightness: 100, contrast: 100, src: STOCK_VIDEOS[0].src },
                { id: 'c2', track: 'text', name: 'Title Overlay', startTime: 2, duration: 8, type: 'text', text: 'DREAMCUT STUDIO', color: '#ffffff', size: 32 },
                { id: 'c3', track: 'audio', name: 'Synthwave Beat', startTime: 0, duration: 20, type: 'audio', volume: 80 }
            ]);

            const videoRef = useRef(null);

            // Playback Sync
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentTime(prev => {
                            if (prev >= totalDuration) {
                                setIsPlaying(false);
                                return 0;
                            }
                            return prev + 0.1;
                        });
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [isPlaying, totalDuration]);

            const activeClip = clips.find(c => c.id === activeClipId);

            const updateActiveClip = (key, value) => {
                setClips(clips.map(clip => clip.id === activeClipId ? { ...clip, [key]: value } : clip));
            };

            const addClipToTimeline = (item, type) => {
                const newClip = {
                    id: 'c_' + Date.now(),
                    track: type,
                    name: item.name,
                    startTime: currentTime,
                    duration: item.duration || 5,
                    type: type,
                    scale: 100,
                    opacity: 100,
                    brightness: 100,
                    contrast: 100,
                    text: item.text || item.name,
                    color: item.color || '#ffffff',
                    src: item.src || ''
                };
                setClips([...clips, newClip]);
                setActiveClipId(newClip.id);
            };

            const splitClip = () => {
                if (!activeClip) return;
                const splitPoint = currentTime - activeClip.startTime;
                if (splitPoint <= 0 || splitPoint >= activeClip.duration) return;

                const firstHalf = { ...activeClip, duration: splitPoint };
                const secondHalf = {
                    ...activeClip,
                    id: 'c_' + Date.now(),
                    startTime: currentTime,
                    duration: activeClip.duration - splitPoint
                };

                setClips(clips.map(c => c.id === activeClip.id ? firstHalf : c).concat(secondHalf));
            };

            const deleteClip = () => {
                if (!activeClipId) return;
                setClips(clips.filter(c => c.id !== activeClipId));
                setActiveClipId(null);
            };

            const triggerExport = () => {
                setExportModal(true);
                setExportProgress(0);
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    setExportProgress(progress);
                    if (progress >= 100) {
                        clearInterval(interval);
                    }
                }, 300);
            };

            return (
                <div class="flex flex-col h-screen bg-[#0d0d0d] text-neutral-200 overflow-hidden select-none">
                    
                    <!-- HEADER BAR -->
                    <header class="h-12 bg-[#141414] border-b border-[#222222] flex items-center justify-between px-4 z-20">
                        <div class="flex items-center gap-3">
                            <div class="w-6 h-6 rounded bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-black text-xs tracking-tighter">
                                DC
                            </div>
                            <span class="font-bold text-white tracking-wider text-sm flex items-center gap-1.5">
                                DREAMCUT <span class="text-[10px] bg-neutral-800 text-neutral-400 px-1.5 py-0.5 rounded font-mono">PRO v2.6</span>
                            </span>
                        </div>

                        <!-- Project Controls -->
                        <div class="flex items-center gap-4 text-xs">
                            <div class="flex items-center gap-2 bg-[#1a1a1a] border border-[#2a2a2a] px-2.5 py-1 rounded">
                                <span class="text-neutral-500 font-mono">Aspect Ratio:</span>
                                <select 
                                    value={aspectRatio} 
                                    onChange={(e) => setAspectRatio(e.target.value)} 
                                    class="bg-transparent text-white font-medium focus:outline-none cursor-pointer"
                                >
                                    <option value="16:9">16:9 (Landscape)</option>
                                    <option value="9:16">9:16 (TikTok / Reels)</option>
                                    <option value="1:1">1:1 (Square)</option>
                                    <option value="4:5">4:5 (Instagram)</option>
                                    <option value="21:9">21:9 (Cinematic)</option>
                                </select>
                            </div>
                        </div>

                        <button 
                            onClick={triggerExport}
                            class="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-4 py-1.5 rounded text-xs tracking-wide transition-all shadow-lg shadow-cyan-500/20 flex items-center gap-1.5"
                        >
                            Export Video
                        </button>
                    </header>

                    <!-- MAIN WORKSPACE (3 PANELS) -->
                    <div class="flex-1 flex overflow-hidden">
                        
                        <!-- LEFT PANEL: MEDIA & ASSETS -->
                        <div class="w-80 bg-[#121212] border-r border-[#222222] flex">
                            <!-- Tool Selector Sidebar -->
                            <div class="w-16 bg-[#0a0a0a] border-r border-[#1a1a1a] flex flex-col items-center py-3 gap-5 text-neutral-400">
                                <button 
                                    onClick={() => setActiveTab('media')} 
                                    class={`flex flex-col items-center gap-1 text-[10px] font-medium transition-colors ${activeTab === 'media' ? 'text-cyan-400' : 'hover:text-white'}`}
                                >
                                    <div class={`p-2 rounded-lg ${activeTab === 'media' ? 'bg-neutral-800' : ''}`}>📁</div>
                                    Media
                                </button>

                                <button 
                                    onClick={() => setActiveTab('audio')} 
                                    class={`flex flex-col items-center gap-1 text-[10px] font-medium transition-colors ${activeTab === 'audio' ? 'text-cyan-400' : 'hover:text-white'}`}
                                >
                                    <div class={`p-2 rounded-lg ${activeTab === 'audio' ? 'bg-neutral-800' : ''}`}>🎵</div>
                                    Audio
                                </button>

                                <button 
                                    onClick={() => setActiveTab('text')} 
                                    class={`flex flex-col items-center gap-1 text-[10px] font-medium transition-colors ${activeTab === 'text' ? 'text-cyan-400' : 'hover:text-white'}`}
                                >
                                    <div class={`p-2 rounded-lg ${activeTab === 'text' ? 'bg-neutral-800' : ''}`}>✏️</div>
                                    Text
                                </button>

                                <button 
                                    onClick={() => setActiveTab('effects')} 
                                    class={`flex flex-col items-center gap-1 text-[10px] font-medium transition-colors ${activeTab === 'effects' ? 'text-cyan-400' : 'hover:text-white'}`}
                                >
                                    <div class={`p-2 rounded-lg ${activeTab === 'effects' ? 'bg-neutral-800' : ''}`}>✨</div>
                                    Effects
                                </button>
                            </div>

                            <!-- Tab Drawer Content -->
                            <div class="flex-1 p-3 overflow-y-auto">
                                {activeTab === 'media' && (
                                    <div>
                                        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Project Stock Videos</h3>
                                        <div class="grid grid-cols-1 gap-2.5">
                                            {STOCK_VIDEOS.map(item => (
                                                <div 
                                                    key={item.id}
                                                    onClick={() => addClipToTimeline(item, 'video')}
                                                    class="group relative bg-[#1a1a1a] border border-[#262626] rounded overflow-hidden cursor-pointer hover:border-cyan-500 transition-all"
                                                >
                                                    <img src={item.thumb} class="w-full h-24 object-cover group-hover:scale-105 transition-transform duration-300" />
                                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-2 flex flex-col justify-end">
                                                        <span class="text-xs font-semibold text-white truncate">{item.name}</span>
                                                        <span class="text-[10px] font-mono text-neutral-400">{item.duration}s</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'audio' && (
                                    <div>
                                        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Audio Library</h3>
                                        <div class="space-y-2">
                                            {STOCK_AUDIO.map(item => (
                                                <div 
                                                    key={item.id}
                                                    onClick={() => addClipToTimeline(item, 'audio')}
                                                    class="p-2.5 bg-[#1a1a1a] border border-[#262626] rounded flex items-center justify-between cursor-pointer hover:border-cyan-500 transition-all"
                                                >
                                                    <div>
                                                        <p class="text-xs font-medium text-white">{item.name}</p>
                                                        <span class="text-[10px] text-neutral-500 font-mono">{item.genre} • {item.duration}s</span>
                                                    </div>
                                                    <span class="text-xs text-cyan-400">+ Add</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'text' && (
                                    <div>
                                        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Text Presets</h3>
                                        <div class="space-y-2">
                                            {TEXT_PRESETS.map(item => (
                                                <div 
                                                    key={item.id}
                                                    onClick={() => addClipToTimeline(item, 'text')}
                                                    class="p-3 bg-[#1a1a1a] border border-[#262626] rounded cursor-pointer hover:border-cyan-500 transition-all"
                                                >
                                                    <p class="text-xs font-bold text-white mb-1" style={{ fontFamily: item.font, color: item.color }}>{item.text}</p>
                                                    <span class="text-[10px] text-neutral-500">{item.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'effects' && (
                                    <div>
                                        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Visual Filters</h3>
                                        <div class="grid grid-cols-2 gap-2 text-center text-xs">
                                            <div onClick={() => updateActiveClip('grayscale', 100)} class="p-4 bg-[#1a1a1a] border border-[#262626] rounded cursor-pointer hover:border-cyan-500">B&W Film</div>
                                            <div onClick={() => updateActiveClip('brightness', 130)} class="p-4 bg-[#1a1a1a] border border-[#262626] rounded cursor-pointer hover:border-cyan-500">Bright Pop</div>
                                            <div onClick={() => updateActiveClip('contrast', 140)} class="p-4 bg-[#1a1a1a] border border-[#262626] rounded cursor-pointer hover:border-cyan-500">High Contrast</div>
                                            <div onClick={() => { updateActiveClip('brightness', 100); updateActiveClip('contrast', 100); }} class="p-4 bg-neutral-800 border border-neutral-700 rounded cursor-pointer">Reset Filters</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <!-- CENTER PANEL: PLAYER CANVAS VIEWPORT -->
                        <div class="flex-1 bg-[#090909] flex flex-col items-center justify-center p-6 relative">
                            
                            <!-- Video Aspect Ratio Frame Box -->
                            <div 
                                class="relative bg-black border border-[#222222] shadow-2xl flex items-center justify-center overflow-hidden transition-all duration-300"
                                style={{
                                    aspectRatio: aspectRatio.replace(':', '/'),
                                    maxHeight: '70vh',
                                    maxWidth: '100%'
                                }}
                            >
                                <video 
                                    ref={videoRef}
                                    src={clips.find(c => c.type === 'video')?.src || STOCK_VIDEOS[0].src}
                                    class="w-full h-full object-cover"
                                    style={{
                                        transform: `scale(${activeClip?.scale ? activeClip.scale / 100 : 1})`,
                                        opacity: (activeClip?.opacity ?? 100) / 100,
                                        filter: `brightness(${activeClip?.brightness ?? 100}%) contrast(${activeClip?.contrast ?? 100}%)`
                                    }}
                                    crossOrigin="anonymous"
                                />

                                <!-- Canvas Text Overlays -->
                                {clips.filter(c => c.type === 'text' && currentTime >= c.startTime && currentTime <= (c.startTime + c.duration)).map(textClip => (
                                    <div 
                                        key={textClip.id}
                                        class="absolute inset-0 flex items-center justify-center pointer-events-none"
                                    >
                                        <span 
                                            class="font-extrabold tracking-wider drop-shadow-md px-4 py-2"
                                            style={{
                                                fontSize: `${textClip.size || 32}px`,
                                                color: textClip.color || '#ffffff'
                                            }}
                                        >
                                            {textClip.text}
                                        </span>
                                    </div>
                                ))}
                            </div>

                            <!-- Viewport Playback Controller Bar -->
                            <div class="mt-4 flex items-center gap-6 bg-[#121212] border border-[#222222] px-6 py-2 rounded-full text-xs font-mono">
                                <button 
                                    onClick={() => setIsPlaying(!isPlaying)}
                                    class="w-8 h-8 rounded-full bg-cyan-500 text-black flex items-center justify-center font-bold hover:bg-cyan-400 transition-colors"
                                >
                                    {isPlaying ? '⏸' : '▶'}
                                </button>
                                
                                <span class="text-neutral-400">
                                    <strong class="text-white">{currentTime.toFixed(1)}s</strong> / {totalDuration.toFixed(1)}s
                                </span>
                            </div>
                        </div>

                        <!-- RIGHT PANEL: INSPECTOR / PROPERTIES -->
                        <div class="w-72 bg-[#121212] border-l border-[#222222] p-4 flex flex-col gap-5 overflow-y-auto">
                            <h3 class="text-xs font-bold text-white uppercase tracking-wider border-b border-[#222222] pb-2">
                                Clip Inspector
                            </h3>

                            {activeClip ? (
                                <div class="space-y-4 text-xs">
                                    <div class="bg-[#1a1a1a] p-2.5 rounded border border-[#262626]">
                                        <span class="text-[10px] text-neutral-500 uppercase font-mono block">Selected Element</span>
                                        <p class="font-bold text-white mt-0.5 truncate">{activeClip.name}</p>
                                    </div>

                                    {activeClip.type === 'video' && (
                                        <>
                                            <div>
                                                <div class="flex justify-between text-neutral-400 mb-1">
                                                    <span>Scale</span>
                                                    <span class="font-mono">{activeClip.scale}%</span>
                                                </div>
                                                <input 
                                                    type="range" min="50" max="200" value={activeClip.scale || 100} 
                                                    onChange={(e) => updateActiveClip('scale', parseInt(e.target.value))}
                                                    class="w-full accent-cyan-400 h-1 bg-[#222] rounded"
                                                />
                                            </div>

                                            <div>
                                                <div class="flex justify-between text-neutral-400 mb-1">
                                                    <span>Opacity</span>
                                                    <span class="font-mono">{activeClip.opacity}%</span>
                                                </div>
                                                <input 
                                                    type="range" min="0" max="100" value={activeClip.opacity ?? 100} 
                                                    onChange={(e) => updateActiveClip('opacity', parseInt(e.target.value))}
                                                    class="w-full accent-cyan-400 h-1 bg-[#222] rounded"
                                                />
                                            </div>

                                            <div>
                                                <div class="flex justify-between text-neutral-400 mb-1">
                                                    <span>Brightness</span>
                                                    <span class="font-mono">{activeClip.brightness}%</span>
                                                </div>
                                                <input 
                                                    type="range" min="0" max="200" value={activeClip.brightness ?? 100} 
                                                    onChange={(e) => updateActiveClip('brightness', parseInt(e.target.value))}
                                                    class="w-full accent-cyan-400 h-1 bg-[#222] rounded"
                                                />
                                            </div>
                                        </>
                                    )}

                                    {activeClip.type === 'text' && (
                                        <>
                                            <div>
                                                <label class="text-neutral-400 block mb-1">Text Content</label>
                                                <input 
                                                    type="text" 
                                                    value={activeClip.text || ''} 
                                                    onChange={(e) => updateActiveClip('text', e.target.value)}
                                                    class="w-full bg-[#1a1a1a] border border-[#2a2a2a] rounded px-3 py-1.5 text-white focus:outline-none focus:border-cyan-400"
                                                />
                                            </div>

                                            <div>
                                                <label class="text-neutral-400 block mb-1">Text Color</label>
                                                <input 
                                                    type="color" 
                                                    value={activeClip.color || '#ffffff'} 
                                                    onChange={(e) => updateActiveClip('color', e.target.value)}
                                                    class="w-full h-8 bg-transparent cursor-pointer rounded"
                                                />
                                            </div>
                                        </>
                                    )}

                                    {activeClip.type === 'audio' && (
                                        <div>
                                            <div class="flex justify-between text-neutral-400 mb-1">
                                                <span>Volume</span>
                                                <span class="font-mono">{activeClip.volume}%</span>
                                            </div>
                                            <input 
                                                type="range" min="0" max="100" value={activeClip.volume || 80} 
                                                onChange={(e) => updateActiveClip('volume', parseInt(e.target.value))}
                                                class="w-full accent-cyan-400 h-1 bg-[#222] rounded"
                                            />
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <p class="text-xs text-neutral-500 italic">Select a clip on the timeline to edit properties.</p>
                            )}
                        </div>
                    </div>

                    <!-- BOTTOM MULTITRACK TIMELINE -->
                    <div class="h-64 bg-[#111111] border-t border-[#222222] flex flex-col z-10">
                        
                        <!-- Timeline Tools Bar -->
                        <div class="h-9 bg-[#161616] border-b border-[#222222] flex items-center justify-between px-4 text-xs">
                            <div class="flex items-center gap-3">
                                <button onClick={splitClip} class="hover:text-cyan-400 font-medium flex items-center gap-1">✂️ Split Clip</button>
                                <button onClick={deleteClip} class="hover:text-red-400 font-medium flex items-center gap-1">🗑️ Delete</button>
                            </div>

                            <div class="text-neutral-500 font-mono text-[11px]">
                                Playhead: <span class="text-white">{currentTime.toFixed(2)}s</span>
                            </div>
                        </div>

                        <!-- Multitrack Container -->
                        <div class="flex-1 p-3 overflow-x-auto relative space-y-2 bg-[#0c0c0c]">
                            
                            <!-- Red Playhead Needle Bar -->
                            <div 
                                class="absolute top-0 bottom-0 w-0.5 bg-red-500 z-30 pointer-events-none"
                                style={{ left: `${(currentTime / totalDuration) * 100}%` }}
                            >
                                <div class="w-3 h-3 bg-red-500 rotate-45 -ml-1.2 -mt-1.5"></div>
                            </div>

                            <!-- Video Track Layer -->
                            <div class="flex items-center gap-3">
                                <span class="w-16 text-[10px] font-bold text-neutral-500 uppercase tracking-wider">Video</span>
                                <div class="flex-1 h-12 bg-[#181818] border border-[#242424] rounded relative">
                                    {clips.filter(c => c.type === 'video').map(clip => (
                                        <div 
                                            key={clip.id}
                                            onClick={() => setActiveClipId(clip.id)}
                                            class={`absolute top-1 bottom-1 rounded px-2 text-xs flex items-center truncate cursor-pointer transition-all ${
                                                activeClipId === clip.id ? 'bg-cyan-600 border border-cyan-300 text-white shadow-md' : 'bg-cyan-950/60 border border-cyan-800/60 text-cyan-200'
                                            }`}
                                            style={{
                                                left: `${(clip.startTime / totalDuration) * 100}%`,
                                                width: `${(clip.duration / totalDuration) * 100}%`
                                            }}
                                        >
                                            🎬 {clip.name}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <!-- Text Track Layer -->
                            <div class="flex items-center gap-3">
                                <span class="w-16 text-[10px] font-bold text-neutral-500 uppercase tracking-wider">Text</span>
                                <div class="flex-1 h-10 bg-[#181818] border border-[#242424] rounded relative">
                                    {clips.filter(c => c.type === 'text').map(clip => (
                                        <div 
                                            key={clip.id}
                                            onClick={() => setActiveClipId(clip.id)}
                                            class={`absolute top-1 bottom-1 rounded px-2 text-xs flex items-center truncate cursor-pointer transition-all ${
                                                activeClipId === clip.id ? 'bg-purple-600 border border-purple-300 text-white shadow-md' : 'bg-purple-950/60 border border-purple-800/60 text-purple-200'
                                            }`}
                                            style={{
                                                left: `${(clip.startTime / totalDuration) * 100}%`,
                                                width: `${(clip.duration / totalDuration) * 100}%`
                                            }}
                                        >
                                            ✏️ {clip.text}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <!-- Audio Track Layer -->
                            <div class="flex items-center gap-3">
                                <span class="w-16 text-[10px] font-bold text-neutral-500 uppercase tracking-wider">Audio</span>
                                <div class="flex-1 h-10 bg-[#181818] border border-[#242424] rounded relative">
                                    {clips.filter(c => c.type === 'audio').map(clip => (
                                        <div 
                                            key={clip.id}
                                            onClick={() => setActiveClipId(clip.id)}
                                            class={`absolute top-1 bottom-1 rounded px-2 text-xs flex items-center truncate cursor-pointer transition-all ${
                                                activeClipId === clip.id ? 'bg-emerald-600 border border-emerald-300 text-white shadow-md' : 'bg-emerald-950/60 border border-emerald-800/60 text-emerald-200'
                                            }`}
                                            style={{
                                                left: `${(clip.startTime / totalDuration) * 100}%`,
                                                width: `${(clip.duration / totalDuration) * 100}%`
                                            }}
                                        >
                                            🎵 {clip.name}
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- EXPORT MODAL -->
                    {exportModal && (
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-[#141414] border border-[#262626] rounded-xl p-6 w-full max-w-md shadow-2xl text-center">
                                <h3 class="text-lg font-bold text-white mb-2">Exporting DreamCut Video</h3>
                                <p class="text-xs text-neutral-400 mb-6">Compiling multitrack sequence into 1080p MP4 file...</p>

                                <div class="w-full bg-[#222] h-3 rounded-full overflow-hidden mb-3">
                                    <div 
                                        class="bg-cyan-400 h-full transition-all duration-300"
                                        style={{ width: `${exportProgress}%` }}
                                    ></div>
                                </div>

                                <span class="text-xs font-mono text-cyan-400">{exportProgress}% Completed</span>

                                {exportProgress >= 100 && (
                                    <button 
                                        onClick={() => setExportModal(false)}
                                        class="mt-6 w-full py-2 bg-white text-black font-bold text-xs uppercase tracking-wider rounded hover:bg-neutral-200 transition-colors"
                                    >
                                        Download Video
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DreamCutApp />);
    </script>
</body>
</html>
